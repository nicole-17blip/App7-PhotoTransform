<!DOCTYPE html>
<html lang="en">

<!-- SIMPLE LAMP ANALYZER — FINAL VERSION
This app:
• Uploads image
• Detects pink vs yellow pixels
• Estimates number of positive tubes
• Displays result
EDUCATIONAL ONLY
-->

<head>
<meta charset="UTF-8">
<title>LAMP Analyzer</title>

<style>
  body { font-family: Arial; text-align:center; margin:40px; }
  canvas { border:2px solid black; margin-top:10px; }
</style>
</head>

<body>

<h1>LAMP Image Analyzer</h1>
<p>Upload a photo of test tubes.</p>

<input type="file" id="upload">
<br><br>

<canvas id="canvas" width="500" height="350"></canvas>

<h2 id="result"></h2>
<h3 id="tubeCount"></h3>

<script>
// grab elements
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultText = document.getElementById("result");
const tubeText = document.getElementById("tubeCount");

// load image
upload.addEventListener("change", function(event){
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
            ctx.drawImage(img, 0, 0, 500, 350);
            analyzeImage();
        }
        img.src = e.target.result;
    }
    reader.readAsDataURL(file);
});


// MAIN ANALYSIS FUNCTION
function analyzeImage(){

    const imageData = ctx.getImageData(0,0,500,350);
    const pixels = imageData.data;
    const width = 500;
    const height = 350;

    let yellowPixels = 0;
    let validPixels = 0;

    // array to track yellow per column (tube finder!)
    let yellowColumnHits = new Array(width).fill(0);

    // scan every pixel
    for(let y=0; y<height; y++){
        for(let x=0; x<width; x++){

            let i = (y * width + x) * 4;
            let r = pixels[i];
            let g = pixels[i+1];
            let b = pixels[i+2];

            // ignore gray/white background
            let colorStrength = Math.max(r,g,b) - Math.min(r,g,b);
            if(colorStrength < 40) continue;

            validPixels++;

            // YELLOW DETECTION (POSITIVE)
            if(r > 160 && g > 160 && b < 140){
                yellowPixels++;
                yellowColumnHits[x]++; // mark this column as yellow
            }
        }
    }

    // ---------------------------
    // DETERMINE OVERALL RESULT
    // ---------------------------
    if(yellowPixels > validPixels * 0.05){
        resultText.innerHTML = "RESULT: POSITIVE (Yellow detected)";
        resultText.style.color = "green";
    } else {
        resultText.innerHTML = "RESULT: NEGATIVE (No yellow detected)";
        resultText.style.color = "red";
    }

    // ---------------------------
    // TUBE COUNTER (column scan)
    // ---------------------------
    let tubeCount = 0;
    let insideTube = false;

    for(let x=0; x<width; x++){
        if(yellowColumnHits[x] > 20 && !insideTube){
            tubeCount++;
            insideTube = true;
        }
        if(yellowColumnHits[x] <= 20){
            insideTube = false;
        }
    }

    tubeText.innerHTML = "Estimated POSITIVE Tubes: " + tubeCount;
}

</script>
</body>
</html>
