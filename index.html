<!DOCTYPE html>
<html lang="en">

<!-- =========================================================
 SIMPLE LAMP COLOR ANALYZER (GitHub Version)
 -------------------------------------------------------------
 This app:
 1) Lets user upload an image
 2) Reads pixels from the image
 3) Compares RED vs yellow color levels
 4) Outputs POSITIVE / NEGATIVE result

 LAMP rule used:
   Pink  = Positive  (more RED than Yellow)
   Yellow = Negative (RED and Yellow similar)

 EDUCATIONAL USE ONLY – NOT A MEDICAL TOOL
========================================================= -->

<head>
<meta charset="UTF-8">
<title>Simple LAMP Analyzer</title>

<style>
  body { font-family: Arial; text-align:center; margin:40px; }
  canvas { border:2px solid black; margin-top:10px; }
</style>
</head>

<body>

<h1>LAMP Image Analyzer</h1>
<p>Upload a photo of test tubes.</p>

<!-- IMAGE UPLOAD BUTTON -->
<input type="file" id="upload">

<br><br>

<!-- CANVAS TO SHOW IMAGE -->
<canvas id="canvas" width="500" height="350"></canvas>

<h2 id="result"></h2>

<script>
// =========================================================
// MAIN PROGRAM
// Runs when user uploads an image
// =========================================================

// get HTML elements
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultText = document.getElementById("result");

// when user selects an image
upload.addEventListener("change", function(event){

    // get uploaded file
    const file = event.target.files[0];
    const reader = new FileReader();

    // load image into browser
    reader.onload = function(e){
        const img = new Image();
        img.onload = function(){

            // draw image onto canvas
            ctx.drawImage(img, 0, 0, 500, 350);

            // analyze colors after drawing
            analyzeImage();
        }
        img.src = e.target.result;
    }
    reader.readAsDataURL(file);
});


// =========================================================
// FUNCTION: analyzeImage()
// Reads every pixel and compares RED vs Yellow
// =========================================================
function analyzeImage(){

    // get pixel data from canvas
    const imageData = ctx.getImageData(0,0,500,350);
    const pixels = imageData.data;

    let totalRed = 0;
    let totalYellow = 0;
    let pixelCount = pixels.length / 4;

    // loop through every pixel
    for(let i=0; i<pixels.length; i+=4){
        totalRed += pixels[i];     // red channel
        totalYellow += pixels[i+1]; // yellow channel
    }

    // calculate averages
    let avgRed = totalRed / pixelCount;
    let avgYellow = totalYellow / pixelCount;

    // compare colors
    let difference = avgRed - avgYellow;
//pink to yellow = postive amplification meaning THERE Is a presence 
    // determine result
    if(difference > 20){
        resultText.innerHTML = "RESULT: NEGATIVE (Pink detected)";
        resultText.style.color = "red";
    } else {
        resultText.innerHTML = "RESULT: POSITIVE (Yellow detected)";
        resultText.style.color = "Yellow";
    }
}

</script>
</body>
</html>
