<!DOCTYPE html>
<html lang="en">

<!-- SIMPLE LAMP ANALYZER — FINAL VERSION
This app:
• Uploads image
• Detects pink vs yellow pixels
• Estimates number of positive tubes
• Displays result
EDUCATIONAL ONLY
-->

<head>
<meta charset="UTF-8">
<title>LAMP Analyzer</title>

<style>
  body { font-family: Arial; text-align:center; margin:40px; }
  canvas { border:2px solid black; margin-top:10px; }
</style>
</head>

<body>

<h1>LAMP Image Analyzer</h1>
<p>Upload a photo of test tubes.</p>

<input type="file" id="upload">
<br><br>

<canvas id="canvas" width="500" height="350"></canvas>

<h2 id="result"></h2>
<h3 id="tubeCount"></h3>

<script>
// grab elements
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultText = document.getElementById("result");
const tubeText = document.getElementById("tubeCount");

// load image
upload.addEventListener("change", function(event){
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
            ctx.drawImage(img, 0, 0, 500, 350);
            analyzeImage();
        }
        img.src = e.target.result;
    }
    reader.readAsDataURL(file);
});


// MAIN ANALYSIS FUNCTION
function analyzeImage(){

    const imageData = ctx.getImageData(0,0,500,350);
    const pixels = imageData.data;

    let yellowPixels = 0;
    let pinkPixels = 0;
    let validPixels = 0; // pixels that actually contain color

    for(let i=0; i<pixels.length; i+=4){

        let r = pixels[i];
        let g = pixels[i+1];
        let b = pixels[i+2];

        // ⭐ STEP 1 — IGNORE BACKGROUND
        // measure how colorful the pixel is
        let maxColor = Math.max(r,g,b);
        let minColor = Math.min(r,g,b);
        let colorStrength = maxColor - minColor;

        // skip gray/white pixels
        if(colorStrength < 40) continue;

        validPixels++;

        // ⭐ STEP 2 — DETECT YELLOW vs PINK
        if(r > 150 && g > 150 && b < 140){
            yellowPixels++;
        }

        if(r > 170 && g < 140 && b > 120){
            pinkPixels++;
        }
    }

    // ⭐ STEP 3 — RESULT
    if(pinkPixels > yellowPixels){
        resultText.innerHTML = "RESULT: POSITIVE (Pink detected)";
        resultText.style.color = "red";
    } else {
        resultText.innerHTML = "RESULT: NEGATIVE (Yellow detected)";
        resultText.style.color = "green";
    }

    // ⭐ STEP 4 — TUBE ESTIMATION
    let pinkRatio = pinkPixels / validPixels;

    let estimatedPositiveTubes = Math.round(pinkRatio * 8);
    let estimatedNegativeTubes = 8 - estimatedPositiveTubes;

    tubeText.innerHTML =
        "Estimated Positive Tubes: " + estimatedPositiveTubes +
        " | Estimated Negative Tubes: " + estimatedNegativeTubes;
}

</script>
</body>
</html>
